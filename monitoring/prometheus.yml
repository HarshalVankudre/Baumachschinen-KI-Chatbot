# =============================================================================
# Prometheus Configuration for Baumaschinen-KI
# =============================================================================
# Purpose: Scrape metrics from Weaviate and other services
# Retention: 30 days
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'baumaschinen-ki'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # =============================================================================
  # Prometheus self-monitoring
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # =============================================================================
  # Weaviate vector database metrics
  # =============================================================================
  - job_name: 'weaviate'
    scrape_interval: 10s
    static_configs:
      - targets: ['weaviate:2112']
        labels:
          service: 'weaviate'
          component: 'vector-database'

    # Metric relabeling
    metric_relabel_configs:
      # Keep only important metrics to reduce cardinality
      - source_labels: [__name__]
        regex: 'weaviate_(.*)'
        action: keep

  # =============================================================================
  # Backend API metrics (if you add Prometheus client to FastAPI)
  # =============================================================================
  # - job_name: 'backend'
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ['backend:8000']
  #       labels:
  #         service: 'backend'
  #         component: 'api'
  #   metrics_path: '/metrics'

# Recording rules for aggregations
# rule_files:
#   - 'rules/*.yml'
